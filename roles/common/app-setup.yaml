- name: create roboshop system user
  ansible.builtin.user:
    name: roboshop
    shell: /sbin/nologin
    system: true
    home: /app

- name: create app dir
  ansible.builtin.file: 
    path: /app
    state: directory

- name: "download {{ component }} code"
  ansible.builtin.get_url:
    url: "https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip"
    dest: /tmp/"{{ component }}".zip

# this thinks file is exist in ansible control server
# so we need to use remote_src: yes means files already exist in "{{ component }}" server  
- name: "Extract {{ component }} code"
  ansible.builtin.unarchive:
    src: "/tmp/{{ component }}.zip"
    dest: /app
    remote_src: yes